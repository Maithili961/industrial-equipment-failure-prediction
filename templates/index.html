
<!DOCTYPE html>
<html>
<head>
    <title>Industrial Equipment Failure Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }
        h1 {
            text-align: center;
            color: #183153;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #1d4e89;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #14365d;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            background: #e8f0fa;
            color: #183153;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Industrial Equipment Failure Prediction</h1>
    <p>Enter machine operating parameters to predict possible machine failure.</p>

    <form method="POST">

        <label>Machine Type</label>
        <select name="type" required>
            <option value="L">Low (L)</option>
            <option value="M">Medium (M)</option>
            <option value="H">High (H)</option>
        </select>

        <label>Air Temperature (K)</label>
        <input type="number" step="any" name="air_temp" value="300" required>

        <label>Process Temperature (K)</label>
        <input type="number" step="any" name="process_temp" value="310" required>

        <label>Rotational Speed (rpm)</label>
        <input type="number" step="any" name="rpm" value="1500" required>

        <label>Torque (Nm)</label>
        <input type="number" step="any" name="torque" value="40" required>

        <label>Tool Wear (min)</label>
        <input type="number" step="any" name="tool_wear" value="100" required>

        <button type="submit">Predict Machine Failure</button>

    </form>

    {% if result %}
        <div class="result">
            Prediction: {{ result }}
        </div>
    {% endif %}

</div>

</body>
</html>
